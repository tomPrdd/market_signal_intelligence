[project]
name = "ptc-extract"
version = "0.1.0"
description = "Extract typed, signed causal claims from text with an LLM."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tom Pradaude" }]
keywords = ["llm", "information-extraction", "causal", "nlp", "structured-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pydantic>=2.5",
    "tenacity>=8.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
anthropic = ["anthropic>=0.40"]
hub = ["huggingface_hub>=0.25", "pyarrow>=15"]
all = [
    "boto3>=1.34",
    "anthropic>=0.40",
    "huggingface_hub>=0.25",
    "pyarrow>=15",
]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/tomPrdd/ptc-extract"
Repository = "https://github.com/tomPrdd/ptc-extract"
Changelog = "https://github.com/tomPrdd/ptc-extract/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptc_extraction"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
