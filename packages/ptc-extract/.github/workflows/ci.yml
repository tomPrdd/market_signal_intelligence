name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs this gate before publishing

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra all

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        run: uv run pytest --cov=src/ptc_extraction --cov-report=term-missing --cov-fail-under=85

  base-install:
    # The package must import cleanly with none of the optional extras present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install base only
        run: uv sync --no-dev

      - name: Import without extras
        run: |
          uv run python -c "import ptc_extraction; print(ptc_extraction.__all__)"
          uv run python -c "
          import ptc_extraction.hub as h
          try:
              h.load_pool_from_hub('x/y')
          except ImportError as e:
              assert 'hub' in str(e), e
              print('hub extra guard OK')
          else:
              raise SystemExit('expected ImportError')
          "

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build wheel and sdist
        run: uv build
