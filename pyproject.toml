[project]
name = "signal-intelligence"
version = "0.1.0"
description = "Causal mechanism extraction from corporate documents for earnings analysis."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Tom Pradaude"}]

dependencies = [
    "ptc-extract[bedrock]",
    "pydantic>=2.5",
    "boto3>=1.34",
    "tenacity>=8.2",
    "python-dateutil>=2.8",
    "tqdm>=4.66",
    "yfinance>=0.2",
    "requests>=2.31",
    "pdfplumber>=0.10",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "lxml>=5.0",
    # signal_intelligence.acquisition.load_universe reads configs/universe.yaml
    # and is exported from the package, so this is a core need, not an extra.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "nbformat>=5.9",
]
acquisition = [
    "exa-py>=1.0",
    "umap-learn>=0.5",
    "playwright>=1.40",
]
app = [
    "streamlit>=1.35",
    "plotly>=5.20",
]
# Static figures for the dataset card and the article. Kept out of the base
# install because nothing in the pipeline or the app imports matplotlib.
figures = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_intelligence"]

# ptc_extraction lives in packages/ptc-extract/ as a standalone, independently
# publishable library. It is consumed here as a uv workspace member so that
# `import ptc_extraction` resolves exactly as it did when it was a sub-package.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ptc-extract = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# packages/ptc-extract/src is listed explicitly as well as being installed as a
# workspace member: on macOS a .pth file that acquires the UF_HIDDEN flag is
# silently skipped by Python 3.12+, which breaks editable installs. If
# `import ptc_extraction` fails outside pytest, run:
#   chflags nohidden .venv/lib/python3.12/site-packages/*.pth
pythonpath = ["src", "packages/ptc-extract/src"]
addopts = "-v --strict-markers --cov=src --cov-report=term-missing"
